<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DDMS Intelligence - Region II</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://leaflet.github.io/Leaflet.heat/dist/leaflet-heat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; margin: 0; overflow-x: hidden; }
        
        /* LOGIN OVERLAY */
        #loginOverlay { position: fixed; inset: 0; background: #020617; z-index: 5000; display: flex; justify-content: center; align-items: center; padding: 20px; }

        /* SIDEBAR & CONTENT */
        .sidebar { width: 280px; background: #020617; height: 100vh; position: fixed; left: 0; top: 0; z-index: 1000; color: white; transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .sidebar.collapsed { left: -280px; }
        .main-content { margin-left: 280px; min-height: 100vh; transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); width: calc(100% - 280px); }
        .main-content.expanded { margin-left: 0; width: 100%; }
        
        @media (max-width: 1024px) {
            .sidebar { left: -280px; }
            .sidebar.active { left: 0; }
            .main-content { margin-left: 0; width: 100%; }
        }

        /* MAP CUSTOM */
        #map { height: 450px !important; width: 100%; border-radius: 2rem; z-index: 5; }
        
        /* FLOATING FILTER ON MAP */
        .map-filter-box {
            position: absolute; top: 20px; left: 20px; z-index: 100;
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px);
            padding: 10px; border-radius: 1.5rem; border: 1px solid rgba(255,255,255,0.5);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }

        #previewModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 9999; padding: 15px; }
    </style>
</head>
<body>

    <div id="loginOverlay">
        <div class="bg-white p-10 rounded-[3rem] shadow-2xl w-full max-w-sm text-center">
            <img src="https://uploads.onecompiler.io/44ana4zau/44ana4h2n/LOGO%20PATRA%20NIAGA.jpg" class="h-8 mx-auto mb-8 grayscale">
            <div class="space-y-4 text-left">
                <div class="space-y-1">
                    <label class="text-[10px] font-black text-slate-400 uppercase ml-2">Username</label>
                    <input type="text" id="userInput" class="w-full bg-slate-50 p-4 rounded-2xl outline-none font-bold text-sm border-2 border-transparent focus:border-blue-500">
                </div>
                <div class="space-y-1">
                    <label class="text-[10px] font-black text-slate-400 uppercase ml-2">Password</label>
                    <input type="password" id="passInput" class="w-full bg-slate-50 p-4 rounded-2xl outline-none font-bold text-sm border-2 border-transparent focus:border-blue-500">
                </div>
                <button onclick="checkLogin()" class="w-full bg-slate-900 text-white p-4 rounded-2xl font-black text-xs uppercase tracking-[0.2em] shadow-xl hover:bg-blue-600 transition-all">Login System</button>
            </div>
        </div>
    </div>

    <div id="previewModal">
        <div class="bg-white w-full h-full rounded-[2.5rem] flex flex-col overflow-hidden max-w-6xl mx-auto shadow-2xl">
            <div class="p-5 border-b flex justify-between items-center bg-slate-900">
                <div class="flex items-center gap-3">
                    <i class="fa-solid fa-file-pdf text-red-500"></i>
                    <span id="modalTitle" class="text-white text-[10px] font-black uppercase tracking-widest">Surat Sanksi</span>
                </div>
                <button onclick="closePreview()" class="bg-red-600 text-white px-8 py-2.5 rounded-2xl text-[10px] font-black uppercase hover:bg-red-700 transition-all">Tutup</button>
            </div>
            <iframe id="pdfFrame" src="" class="w-full h-full border-none"></iframe>
        </div>
    </div>

    <aside id="sidebar" class="sidebar p-8 flex flex-col">
        <div class="flex items-center justify-between mb-12">
            <img src="https://uploads.onecompiler.io/44ana4zau/44ana4h2n/LOGO%20PATRA%20NIAGA.jpg" class="h-7 brightness-200">
            <button onclick="toggleSidebar()" class="lg:hidden text-white text-xl">&times;</button>
        </div>
        
        <nav class="flex-grow space-y-3">
            <p class="text-[9px] font-black text-slate-500 uppercase tracking-[0.3em] mb-6">Navigasi Utama</p>
            <button class="w-full flex items-center p-4 bg-blue-600 text-white rounded-2xl text-[10px] font-black uppercase tracking-widest">
                <i class="fa-solid fa-layer-group mr-4"></i> Dashboard
            </button>
            <button onclick="fetchSheetData()" class="w-full flex items-center p-4 text-slate-400 hover:bg-slate-800 rounded-2xl text-[10px] font-black uppercase tracking-widest transition-all">
                <i class="fa-solid fa-sync-alt mr-4"></i> Sinkronisasi
            </button>
        </nav>

        <button onclick="logout()" class="w-full p-4 border border-red-900/30 text-red-400 rounded-2xl text-[10px] font-black uppercase tracking-widest hover:bg-red-600 hover:text-white transition-all shadow-lg">
            <i class="fa-solid fa-power-off mr-3"></i> Logout Account
        </button>
    </aside>

    <div id="mainContent" class="main-content">
        <header class="bg-white/80 backdrop-blur-xl border-b p-6 flex justify-between items-center sticky top-0 z-[100]">
            <div class="flex items-center gap-5">
                <button onclick="toggleSidebar()" class="bg-slate-100 p-3 rounded-2xl text-slate-600 hover:bg-slate-900 hover:text-white transition-all">
                    <i class="fa-solid fa-bars-staggered"></i>
                </button>
                <div>
                    <h1 class="text-xs font-black text-slate-800 uppercase tracking-[0.1em]">Intelligence DDMS Region II</h1>
                    <p class="text-[9px] text-emerald-500 font-bold uppercase tracking-tight">● Data Terkoneksi Real-Time</p>
                </div>
            </div>
            <div class="hidden md:flex gap-3">
                <div class="bg-slate-50 px-4 py-2 rounded-xl border border-slate-100">
                    <p class="text-[8px] font-black text-slate-400 uppercase">Status User</p>
                    <p class="text-[10px] font-bold text-slate-700 uppercase">Administrator</p>
                </div>
            </div>
        </header>

        <main class="p-4 lg:p-8 space-y-8">
            <div class="relative bg-white p-4 rounded-[3rem] border shadow-sm overflow-hidden">
                <div class="map-filter-box flex items-center gap-3">
                    <div class="bg-blue-600 w-10 h-10 rounded-xl flex items-center justify-center text-white shadow-lg shadow-blue-200">
                        <i class="fa-solid fa-filter"></i>
                    </div>
                    <div>
                        <p class="text-[8px] font-black text-slate-400 uppercase tracking-widest">Pilih Wilayah</p>
                        <select id="provinsiFilter" onchange="applyFilter()" class="bg-transparent border-none text-[11px] font-black text-slate-800 outline-none p-0 pr-6 uppercase cursor-pointer">
                            <option value="Semua">Seluruh Provinsi</option>
                            <option value="SUMSEL">Sumatera Selatan</option>
                            <option value="LAMPUNG">Lampung</option>
                            <option value="JAMBI">Jambi</option>
                            <option value="BENGKULU">Bengkulu</option>
                            <option value="BABEL">Bangka Belitung</option>
                        </select>
                    </div>
                </div>

                <div class="absolute bottom-10 right-10 z-[100] flex gap-4 pointer-events-none lg:pointer-events-auto">
                    <div class="bg-white/90 backdrop-blur p-5 rounded-3xl border shadow-xl text-center min-w-[120px]">
                        <p class="text-[9px] font-black text-slate-400 uppercase mb-1">Critical</p>
                        <h2 id="countCritical" class="text-3xl font-black text-red-600">0</h2>
                    </div>
                    <div class="bg-white/90 backdrop-blur p-5 rounded-3xl border shadow-xl text-center min-w-[120px]">
                        <p class="text-[9px] font-black text-slate-400 uppercase mb-1">Total Agen</p>
                        <h2 id="totalAgen" class="text-3xl font-black text-slate-800">0</h2>
                    </div>
                </div>

                <div id="map"></div>
            </div>

            <div class="bg-white rounded-[3rem] border shadow-sm overflow-hidden">
                <div class="p-8 border-b flex flex-col lg:flex-row justify-between items-center gap-6 bg-slate-50/30">
                    <h3 class="text-[11px] font-black text-slate-400 uppercase tracking-[0.2em]">Rincian Database Sanksi</h3>
                    <div class="relative w-full lg:w-96">
                        <i class="fa-solid fa-magnifying-glass absolute left-5 top-4 text-slate-300"></i>
                        <input type="text" id="searchInput" onkeyup="filterTable()" placeholder="Cari Kode atau Nama Agen..." class="w-full text-xs bg-white border-2 border-slate-100 px-14 py-4 rounded-[1.5rem] outline-none focus:border-blue-500 transition-all font-bold">
                    </div>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-[11px]" id="sanksiTable">
                        <thead class="bg-white text-slate-400 font-black uppercase tracking-widest border-b">
                            <tr>
                                <th class="p-8">Informasi Agen</th>
                                <th class="p-8 text-center">Jenis Sanksi</th>
                                <th class="p-8">Masa Berlaku</th>
                                <th class="p-8 text-center">Dokumen PDF</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody" class="divide-y divide-slate-100 font-bold"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTwfjwCymNlkp3pXQCLbQkbjXsgkxRKcRQh8uKocTVi4kRm53B0PLM9EQ3ZTMdCEw0Li_fJPyZYCGjL/pub?gid=0&single=true&output=csv';
        let map, markers = [], heatLayer, allData = [];

        function checkLogin() {
            if (document.getElementById('userInput').value === 'admin' && document.getElementById('passInput').value === '2026') {
                sessionStorage.setItem('loggedIn', 'true');
                showDashboard();
            }
        }

        function showDashboard() {
            document.getElementById('loginOverlay').style.display = 'none';
            initMap();
            fetchSheetData();
        }

        function logout() { sessionStorage.removeItem('loggedIn'); location.reload(); }

        function toggleSidebar() {
            const sb = document.getElementById('sidebar');
            const mc = document.getElementById('mainContent');
            if (window.innerWidth > 1024) {
                sb.classList.toggle('collapsed');
                mc.classList.toggle('expanded');
                setTimeout(() => map.invalidateSize(), 400);
            } else { sb.classList.toggle('active'); }
        }

        function initMap() {
            if (map != undefined) map.remove();
            map = L.map('map', { zoomControl: false }).setView([-3.31, 104.37], 7);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
            L.control.zoom({ position: 'bottomleft' }).addTo(map);
        }

        async function fetchSheetData() {
            Papa.parse(csvUrl, {
                download: true, header: true,
                complete: function(results) { 
                    allData = results.data; 
                    applyFilter(); 
                }
            });
        }

        function applyFilter() {
            const selectedProv = document.getElementById('provinsiFilter').value;
            const filtered = allData.filter(row => {
                if (selectedProv === "Semua") return true;
                return row.SA && row.SA.toUpperCase().includes(selectedProv);
            });
            renderData(filtered);
        }

        function renderData(data) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            markers.forEach(m => map.removeLayer(m));
            if(heatLayer) map.removeLayer(heatLayer);
            let heatPoints = [], critical = 0; const today = new Date();

            data.forEach(row => {
                if(!row.ID) return;
                const expDate = new Date(row.Masa_Berlaku);
                const diffDays = Math.ceil((expDate - today) / (1000 * 60 * 60 * 24));
                const color = row.Warna === 'red' ? 'red' : (row.Warna === 'orange' ? 'orange' : 'blue');
                if (diffDays <= 3 && diffDays >= 0) critical++;

                tbody.innerHTML += `
                    <tr class="hover:bg-blue-50/40 transition-all border-b border-slate-50 group">
                        <td class="p-8">
                            <div class="text-xs font-black text-slate-800 uppercase tracking-tighter group-hover:text-blue-600 transition-colors">${row.Nama}</div>
                            <div class="text-[9px] text-slate-400 uppercase tracking-widest mt-1">${row.ID} | SA: ${row.SA}</div>
                        </td>
                        <td class="p-8 text-center">
                            <span class="px-5 py-2.5 rounded-[1rem] text-[9px] font-black uppercase bg-${color}-50 text-${color}-600 border border-${color}-100 shadow-sm">
                                ${row.Jenis_Sanksi}
                            </span>
                        </td>
                        <td class="p-8 text-slate-500 font-extrabold uppercase tracking-tight">${row.Masa_Berlaku}</td>
                        <td class="p-8 text-center">
                            <button onclick="openPreview('${row.Link_Surat}', '${row.Nama}')" class="bg-white text-slate-900 px-6 py-3 rounded-2xl border-2 border-slate-100 font-black text-[9px] uppercase hover:bg-red-600 hover:text-white hover:border-red-600 transition-all shadow-sm flex items-center gap-2 mx-auto">
                                <i class="fa-solid fa-file-pdf"></i> Preview Surat
                            </button>
                        </td>
                    </tr>
                `;

                if (row.Lat && row.Lng) {
                    const lat = parseFloat(row.Lat); const lng = parseFloat(row.Lng);
                    heatPoints.push([lat, lng, 0.5]);
                    const m = L.circleMarker([lat, lng], { radius: 10, fillColor: (row.Warna === 'red' ? '#dc2626' : '#ea580c'), color: '#fff', weight: 3, fillOpacity: 1 }).addTo(map);
                    markers.push(m);
                }
            });

            heatLayer = L.heatLayer(heatPoints, {radius: 20, blur: 15}).addTo(map);
            document.getElementById('countCritical').innerText = critical;
            document.getElementById('totalAgen').innerText = data.length;
            if (markers.length > 0) map.fitBounds(new L.featureGroup(markers).getBounds().pad(0.3));
        }

        function openPreview(link, title) {
            let pLink = link.includes('drive.google.com') ? link.replace('/view', '/preview') : link;
            document.getElementById('pdfFrame').src = pLink;
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('previewModal').style.display = 'flex';
        }

        function closePreview() { document.getElementById('previewModal').style.display = 'none'; document.getElementById('pdfFrame').src = ''; }

        function filterTable() {
            let input = document.getElementById("searchInput").value.toUpperCase();
            let rows = document.getElementById("tableBody").getElementsByTagName("tr");
            for (let i = 0; i < rows.length; i++) {
                let txtValue = rows[i].textContent || rows[i].innerText;
                rows[i].style.display = txtValue.toUpperCase().indexOf(input) > -1 ? "" : "none";
            }
        }

        window.onload = () => { if(sessionStorage.getItem('loggedIn') === 'true') showDashboard(); };
    </script>
</body>
</html>
