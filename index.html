<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DDMS Intelligence - Region II</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://leaflet.github.io/Leaflet.heat/dist/leaflet-heat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        
        :root {
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #1e293b;
            --border-color: #e2e8f0;
        }

        .dark-mode {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f1f5f9;
            --border-color: #334155;
        }

        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg-main); color: var(--text-main); margin: 0; overflow-x: hidden; transition: background 0.3s ease; }
        
        .bg-custom-card { background: var(--bg-card); border-color: var(--border-color); }

        /* LOGIN OVERLAY */
        #loginOverlay { position: fixed; inset: 0; background: #020617; z-index: 5000; display: flex; justify-content: center; align-items: center; padding: 20px; }
        
        .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        /* SIDEBAR */
        .sidebar { width: 300px; background: #020617; height: 100vh; position: fixed; left: 0; top: 0; z-index: 1000; color: white; transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .sidebar.collapsed { left: -300px; }
        .main-content { margin-left: 300px; min-height: 100vh; transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); width: calc(100% - 300px); }
        .main-content.expanded { margin-left: 0; width: 100%; }
        
        #map { height: 450px !important; width: 100%; border-radius: 2rem; z-index: 5; }
        .map-filter-box { position: absolute; top: 20px; left: 20px; z-index: 100; background: var(--bg-card); backdrop-filter: blur(10px); padding: 12px; border-radius: 1.5rem; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); border: 1px solid var(--border-color); }
        #previewModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 9999; padding: 15px; }

        /* Smooth Transition for dark mode */
        * { transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease; }
    </style>
</head>
<body class="">

    <div id="loginOverlay">
        <div id="loginCard" class="bg-white p-12 rounded-[3.5rem] shadow-2xl w-full max-w-md text-center border border-slate-100 transition-all duration-300">
            <div class="mb-10 flex justify-center">
                <img src="https://uploads.onecompiler.io/44ana4zau/44ana4h2n/LOGO%20PATRA%20NIAGA.jpg" class="h-30 object-contain" alt="Logo">
            </div>
            <div class="space-y-5 text-left">
                <div class="text-center mb-6 text-slate-800">
                    <h2 class="text-2xl font-black uppercase tracking-tighter">DDMS Intelligence</h2>
                    <p class="text-[10px] text-slate-400 font-bold uppercase mt-1">Region II Sumbagsel</p>
                </div>
                <div class="space-y-3">
                    <input type="text" id="userInput" placeholder="Username" class="w-full bg-slate-50 p-5 rounded-2xl outline-none font-bold text-sm border-2 border-transparent focus:border-blue-500 text-slate-800">
                    <input type="password" id="passInput" placeholder="Password" class="w-full bg-slate-50 p-5 rounded-2xl outline-none font-bold text-sm border-2 border-transparent focus:border-blue-500 text-slate-800">
                </div>
                <div id="loginError" class="hidden flex items-center gap-3 p-4 bg-red-50 rounded-2xl border border-red-100">
                    <i class="fa-solid fa-circle-exclamation text-red-500"></i>
                    <p class="text-[10px] text-red-600 font-black uppercase">Username atau Password Salah!</p>
                </div>
                <button onclick="checkLogin()" class="w-full bg-slate-900 text-white p-5 rounded-2xl font-black text-sm uppercase tracking-widest shadow-2xl hover:bg-blue-600 active:scale-95 transition-all">Masuk Dashboard</button>
            </div>
        </div>
    </div>

    <aside id="sidebar" class="sidebar flex flex-col">
        <div class="p-10 border-b border-slate-800/50">
            <img src="https://uploads.onecompiler.io/44ana4zau/44ana4h2n/LOGO%20PATRA%20NIAGA.jpg" class="h-30 brightness-200 object-contain mx-auto" alt="Logo">
        </div>
        <nav class="flex-grow p-8 space-y-4">
            <button class="w-full flex items-center p-4 bg-blue-600 text-white rounded-2xl text-[10px] font-black uppercase tracking-widest">
                <i class="fa-solid fa-chart-line mr-4"></i> Monitoring
            </button>
            <button onclick="fetchSheetData()" class="w-full flex items-center p-4 text-slate-400 hover:bg-slate-800 rounded-2xl text-[10px] font-black uppercase tracking-widest">
                <i class="fa-solid fa-sync mr-4"></i> Update Data
            </button>
        </nav>
        <div class="p-8">
            <button onclick="logout()" class="w-full p-4 border border-red-900/30 text-red-400 rounded-2xl text-[10px] font-black uppercase hover:bg-red-600 hover:text-white transition-all">
                <i class="fa-solid fa-power-off mr-3"></i> Keluar
            </button>
        </div>
    </aside>

    <div id="mainContent" class="main-content">
        <header class="bg-custom-card border-b p-6 flex justify-between items-center sticky top-0 z-[100] shadow-sm">
            <div class="flex items-center gap-6">
                <button onclick="toggleSidebar()" class="bg-slate-100 dark:bg-slate-800 p-3.5 rounded-2xl text-slate-600 dark:text-slate-300 hover:bg-slate-900 hover:text-white">
                    <i class="fa-solid fa-bars-staggered"></i>
                </button>
                <h1 class="text-sm font-black uppercase tracking-tight">Intelligence Dashboard</h1>
            </div>
            
            <div class="flex items-center gap-4">
                <button onclick="toggleDarkMode()" class="w-11 h-11 rounded-2xl bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-slate-600 dark:text-yellow-400 transition-all border border-transparent hover:border-blue-500">
                    <i id="darkIcon" class="fa-solid fa-moon"></i>
                </button>

                <div class="w-11 h-11 bg-slate-900 rounded-2xl flex items-center justify-center text-white">
                    <i class="fa-solid fa-user-shield text-sm"></i>
                </div>
            </div>
        </header>

        <main class="p-4 lg:p-8 space-y-8">
            <div class="relative bg-custom-card p-4 rounded-[3rem] border shadow-sm">
                <div class="map-filter-box">
                    <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1">Wilayah</p>
                    <select id="provinsiFilter" onchange="applyFilter()" class="bg-transparent text-[12px] font-black outline-none uppercase cursor-pointer">
                        <option value="Semua">Seluruh Wilayah</option>
                        <option value="SUMSEL">Sumatera Selatan</option>
                        <option value="LAMPUNG">Lampung</option>
                        <option value="JAMBI">Jambi</option>
                        <option value="BENGKULU">Bengkulu</option>
                        <option value="BABEL">Bangka Belitung</option>
                    </select>
                </div>
                <div id="map"></div>
            </div>

            <div class="bg-custom-card rounded-[3rem] border shadow-sm overflow-hidden">
                <div class="p-8 border-b flex flex-col lg:flex-row justify-between items-center gap-6">
                    <h3 class="text-xs font-black text-slate-400 uppercase tracking-widest">Database Real-Time</h3>
                    <input type="text" id="searchInput" onkeyup="filterTable()" placeholder="Cari Agen..." class="w-full lg:w-80 text-xs bg-slate-50 dark:bg-slate-800 border-2 border-transparent px-6 py-4 rounded-2xl focus:border-blue-500 outline-none font-bold">
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-[11px]" id="sanksiTable">
                        <thead class="text-slate-400 font-black uppercase border-b bg-slate-50/50 dark:bg-slate-800/50">
                            <tr>
                                <th class="p-8">Nama Agen</th>
                                <th class="p-8 text-center">Tipe Sanksi</th>
                                <th class="p-8">Masa Berlaku</th>
                                <th class="p-8 text-center">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody" class="divide-y divide-slate-100 dark:divide-slate-700 font-bold"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <div id="previewModal">
        <div class="bg-white w-full h-full rounded-[2.5rem] flex flex-col overflow-hidden max-w-6xl mx-auto">
            <div class="p-5 flex justify-between items-center bg-slate-900">
                <span id="modalTitle" class="text-white text-[10px] font-black uppercase">Preview</span>
                <button onclick="closePreview()" class="bg-red-600 text-white px-6 py-2 rounded-xl text-[10px] font-black uppercase">Tutup</button>
            </div>
            <iframe id="pdfFrame" src="" class="w-full h-full border-none"></iframe>
        </div>
    </div>

    <script>
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTwfjwCymNlkp3pXQCLbQkbjXsgkxRKcRQh8uKocTVi4kRm53B0PLM9EQ3ZTMdCEw0Li_fJPyZYCGjL/pub?gid=0&single=true&output=csv';
        let map, markers = [], heatLayer, allData = [];

        // --- DARK MODE LOGIC ---
        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            updateDarkIcon(isDark);
        }

        function updateDarkIcon(isDark) {
            const icon = document.getElementById('darkIcon');
            icon.className = isDark ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
        }

        // --- LOGIN LOGIC ---
        function checkLogin() {
            const user = document.getElementById('userInput').value;
            const pass = document.getElementById('passInput').value;
            if (user === 'admin' && pass === '2026') {
                sessionStorage.setItem('loggedIn', 'true');
                showDashboard();
            } else {
                const card = document.getElementById('loginCard');
                document.getElementById('loginError').classList.remove('hidden');
                card.classList.add('shake');
                setTimeout(() => card.classList.remove('shake'), 500);
            }
        }

        function showDashboard() {
            document.getElementById('loginOverlay').style.display = 'none';
            initMap();
            fetchSheetData();
        }

        function logout() { sessionStorage.removeItem('loggedIn'); location.reload(); }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('collapsed');
            document.getElementById('mainContent').classList.toggle('expanded');
            setTimeout(() => map.invalidateSize(), 400);
        }

        function initMap() {
            if (map != undefined) map.remove();
            map = L.map('map', { zoomControl: false }).setView([-3.31, 104.37], 7);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        }

        async function fetchSheetData() {
            Papa.parse(csvUrl, {
                download: true, header: true,
                complete: function(results) { allData = results.data; applyFilter(); }
            });
        }

        function applyFilter() {
            const sel = document.getElementById('provinsiFilter').value;
            const filtered = allData.filter(row => sel === "Semua" || (row.SA && row.SA.includes(sel)));
            renderData(filtered);
        }

        function renderData(data) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            markers.forEach(m => map.removeLayer(m));
            
            data.forEach(row => {
                if(!row.ID) return;
                const color = row.Warna === 'red' ? 'red' : 'blue';
                tbody.innerHTML += `
                    <tr class="hover:bg-blue-50/10 transition-all">
                        <td class="p-8">
                            <div class="text-sm font-black uppercase">${row.Nama}</div>
                            <div class="text-[10px] text-slate-400 uppercase">${row.ID}</div>
                        </td>
                        <td class="p-8 text-center">
                            <span class="px-4 py-2 rounded-xl text-[9px] font-black uppercase bg-${color}-50/10 text-${color}-500 border border-${color}-500/20">
                                ${row.Jenis_Sanksi}
                            </span>
                        </td>
                        <td class="p-8 text-slate-500 font-extrabold">${row.Masa_Berlaku}</td>
                        <td class="p-8 text-center">
                            <button onclick="openPreview('${row.Link_Surat}', '${row.Nama}')" class="bg-slate-900 text-white px-5 py-3 rounded-xl text-[9px] font-black uppercase hover:bg-blue-600">Preview</button>
                        </td>
                    </tr>
                `;
                if (row.Lat && row.Lng) {
                    const m = L.circleMarker([row.Lat, row.Lng], { radius: 10, fillColor: color, color: '#fff', weight: 2, fillOpacity: 1 }).addTo(map);
                    markers.push(m);
                }
            });
        }

        function openPreview(l, t) {
            document.getElementById('pdfFrame').src = l.replace('/view', '/preview');
            document.getElementById('modalTitle').innerText = t;
            document.getElementById('previewModal').style.display = 'flex';
        }

        function closePreview() { document.getElementById('previewModal').style.display = 'none'; }

        function filterTable() {
            let input = document.getElementById("searchInput").value.toUpperCase();
            let rows = document.getElementById("tableBody").getElementsByTagName("tr");
            for (let i = 0; i < rows.length; i++) {
                rows[i].style.display = rows[i].innerText.toUpperCase().includes(input) ? "" : "none";
            }
        }

        window.onload = () => { 
            // Theme check
            if (localStorage.getItem('theme') === 'dark') {
                document.body.classList.add('dark-mode');
                updateDarkIcon(true);
            }
            if(sessionStorage.getItem('loggedIn') === 'true') showDashboard(); 
        };
    </script>
</body>
</html>
